[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-thread-exporter"
version = "1.0.0"
description = "Export a Slack thread to a clean Markdown or PDF file for knowledge preservation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jishanahmed AR Shaikh", email = "jishanahmedshaikh@gmail.com" }]
keywords = ["slack", "export", "thread", "markdown", "pdf", "knowledge"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
slackexport = "slackexport.cli:main"

[project.urls]
Homepage = "https://github.com/jishanahmed-shaikh/slack-thread-exporter"
Issues   = "https://github.com/jishanahmed-shaikh/slack-thread-exporter/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
